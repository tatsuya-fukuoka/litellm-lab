# 【問題再現用】クールダウン有効 + リトライ1回 の設定。
# 単一デプロイの main-llm → backup-llm のフォールバック構成で、障害が続くと
#   (1) 障害中のリクエストが約2秒かかる（死んだプライマリへのリトライ待ち）
#   (2) 数秒〜数十秒後に backup-llm もクールダウンに入り、429 (all_deployments_in_cooldown) になる
# ことを再現する。README の「フォールバックで見つかった落とし穴」を参照。
# 使い方: .env に LITELLM_CONFIG=./configs/cooldown_pitfall.yaml を書き、
#         COOLDOWNS=on NUM_RETRIES=1 python scripts/test_fallback.py
# 実測ラボ用の設定。上流はすべてモックLLM（実キー不要）。
# 課金額は、モックが返す usage(100/100トークン) × 下の単価 で決まる。
#   1リクエスト = 100*0.00001 + 100*0.00003 = 0.004 USD
model_list:
  # 通常のモデル（予算・フォールバックの検証対象）
  - model_name: main-llm
    litellm_params:
      model: openai/mock-primary
      api_base: os.environ/MOCK_PRIMARY_BASE
      api_key: dummy
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
  # main-llm の落ち先
  - model_name: backup-llm
    litellm_params:
      model: openai/mock-backup
      api_base: os.environ/MOCK_BACKUP_BASE
      api_key: dummy
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
  # オーバーヘッド計測用（フォールバック設定の影響を受けない別名）
  - model_name: bench-llm
    litellm_params:
      model: openai/mock-primary
      api_base: os.environ/MOCK_PRIMARY_BASE
      api_key: dummy

litellm_settings:
  num_retries: 1            # 同じモデルを1回だけ再試行してから、フォールバックへ
  request_timeout: 5        # 5秒を超えたらタイムアウト扱い（slowモードの検証用）
  fallbacks: [{"main-llm": ["backup-llm"]}]
  set_verbose: false
  json_logs: true

router_settings:
  allowed_fails: 2          # 2回を超えて失敗したら
  cooldown_time: 10         # 10秒間そのデプロイをルーティングから外す

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5   # 費用のDB書き込み間隔（既定60秒だと検証が遅いので短縮）
